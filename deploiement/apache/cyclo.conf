#
# CYCLO DAKAR — configuration Apache de production
# =================================================
#
# Ce fichier est un MODÈLE. `deployer.ps1` y remplace les jetons @XXX@ et écrit
# le résultat dans le dossier de production. On ne le lit jamais directement.
#
# POURQUOI UNE CONFIGURATION AUTONOME PLUTÔT QUE CELLE DE XAMPP
#
# XAMPP sert déjà d'autres projets sur les ports 80 et 443 : y greffer Cyclo
# Dakar rendrait chaque déploiement dépendant d'un fichier partagé que
# quelqu'un modifiera un jour pour un autre site. Apache est donc lancé avec
# `-f` sur CE fichier : rien de ce qui existe n'est touché, et le déploiement
# est reproductible sur une machine neuve.
#
# POURQUOI PAS `php artisan serve`
#
# Le serveur de développement de PHP traite UNE requête à la fois. Sur une
# sortie de club, trente téléphones qui synchronisent leur trace en même temps
# se mettraient en file indienne derrière le plus lent. Apache et un banc de
# processus FastCGI servent en parallèle.
#

ServerRoot "@APACHE@"
ServerName localhost

# On n'écoute que sur la boucle locale : c'est le tunnel qui expose le service
# à Internet, en terminant le TLS. Ouvrir ce port sur l'extérieur offrirait un
# accès HTTP en clair, contournant le chiffrement.
Listen 127.0.0.1:@PORT@

LoadModule authz_core_module modules/mod_authz_core.so
LoadModule mime_module modules/mod_mime.so
LoadModule dir_module modules/mod_dir.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule setenvif_module modules/mod_setenvif.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule headers_module modules/mod_headers.so
LoadModule deflate_module modules/mod_deflate.so
LoadModule filter_module modules/mod_filter.so
LoadModule expires_module modules/mod_expires.so
LoadModule alias_module modules/mod_alias.so
LoadModule slotmem_shm_module modules/mod_slotmem_shm.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_fcgi_module modules/mod_proxy_fcgi.so
LoadModule proxy_balancer_module modules/mod_proxy_balancer.so
LoadModule proxy_wstunnel_module modules/mod_proxy_wstunnel.so
LoadModule lbmethod_byrequests_module modules/mod_lbmethod_byrequests.so

PidFile "@LOGS@/apache.pid"
ErrorLog "@LOGS@/apache-erreurs.log"
LogLevel warn

LogFormat "%h %l %u %t \"%r\" %>s %b %D" cyclo
CustomLog "@LOGS@/apache-acces.log" cyclo

# La signature d'Apache annonce sa version exacte, donc la liste des failles
# qui s'y appliquent. On n'en dit pas plus que nécessaire.
ServerTokens Prod
ServerSignature Off
TraceEnable Off

DocumentRoot "@PUBLIC@"
DirectoryIndex index.php index.html

# Par défaut, rien n'est servi. Chaque dossier ouvert l'est explicitement plus
# bas : une faute de frappe dans un chemin donne alors une erreur, pas une
# arborescence exposée.
<Directory />
    AllowOverride None
    Require all denied
    Options None
</Directory>

<Directory "@PUBLIC@">
    AllowOverride None
    Require all granted

    # Pas d'`Indexes` : sans lui, un dossier sans index.html afficherait la
    # liste de son contenu — les justificatifs, les photos des membres.
    Options FollowSymLinks

    RewriteEngine On

    # Laravel : tout ce qui n'est pas un fichier réel part au contrôleur
    # frontal. C'est la traduction des règles du `.htaccess` livré par le
    # framework, écrites ici parce que `AllowOverride None` est plus rapide et
    # rend la configuration lisible d'un seul endroit.
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule ^ index.php [L]
</Directory>

# Aucun fichier caché. `.env` porte le mot de passe de la base : servi une
# seule fois, c'est toute la base qui est perdue.
<FilesMatch "^\.">
    Require all denied
</FilesMatch>

# Ceinture et bretelles. Ces fichiers vivent un cran AU-DESSUS de la racine
# servie — c'est cela qui les protège réellement. La règle ne coûte rien et
# rattraperait une copie malencontreuse dans `public/`.
<FilesMatch "\.(env|log|sqlite|lock)$">
    Require all denied
</FilesMatch>

#
# PHP par FastCGI
# ---------------
#
# Un banc de processus `php-cgi.exe`, chacun sur son port. Sous Windows,
# `php-cgi` ne sait pas se dupliquer lui-même (PHP_FCGI_CHILDREN est une
# notion Unix) : un processus = une requête à la fois. On en lance donc
# plusieurs et Apache répartit.
#
<Proxy "balancer://cyclo-php">
@MEMBRES@
    # Au nombre de requêtes : toutes les requêtes se valent à peu près ici, et
    # cette méthode ne demande aucune mesure de charge.
    ProxySet lbmethod=byrequests
</Proxy>

# Le délai couvre le plus lourd : l'export RGPD d'un membre qui a mille
# sorties. En deçà, Apache couperait une réponse pourtant en train d'arriver
# et le membre croirait à une panne.
ProxyTimeout 120

ProxyPassMatch "^/(.*\.php(/.*)?)$" "balancer://cyclo-php/@PUBLIC_FCGI@/$1"

#
# Service Node — PHASE ultérieure (rendu vidéo)
# ---------------------------------------------
#
# Le service n'est PAS exposé : seul `/ws` sera relayé le jour où le rendu
# vidéo entrera en service. `/render` et `/internal/*` restent sur le réseau
# interne, comme le prévoit docs/deployment.md §5.
#
# ProxyPass "/ws" "ws://127.0.0.1:3001/ws"

#
# En-têtes de sécurité
# --------------------
#
Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "DENY"
Header always set Referrer-Policy "strict-origin-when-cross-origin"

# Le navigateur ne doit pas proposer ces capteurs à une page du club : aucune
# fonctionnalité web n'en a besoin. La géolocalisation, si : c'est elle qui
# enregistre les sorties depuis le navigateur.
Header always set Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()"

# HSTS : le tunnel sert en HTTPS, et une fois la page vue, le navigateur
# refusera de repasser en clair. `max-age` d'un an, sans `preload` — une
# adresse de démonstration ne doit pas être inscrite en dur dans les
# navigateurs du monde entier.
Header always set Strict-Transport-Security "max-age=31536000"

#
# Cache et compression
# --------------------
#
<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE text/html text/plain text/css text/javascript
    AddOutputFilterByType DEFLATE application/javascript application/json
    AddOutputFilterByType DEFLATE image/svg+xml
</IfModule>

# Les fichiers construits portent une empreinte dans leur nom
# (`index-BIzU3qhm.js`) : leur contenu ne changera jamais, on peut donc les
# garder un an. C'est ce qui rend la deuxième visite instantanée sur un
# forfait mobile sénégalais.
<LocationMatch "^/assets/">
    Header always set Cache-Control "public, max-age=31536000, immutable"
</LocationMatch>

# La page d'entrée, elle, ne doit JAMAIS être gardée : c'est elle qui nomme
# les fichiers ci-dessus. Mise en cache, elle continuerait de réclamer les
# anciens après une mise à jour, et l'application resterait figée sur une
# version que le serveur ne sert plus.
<LocationMatch "^/(app/)?(index\.html)?$">
    Header always set Cache-Control "no-cache, must-revalidate"
</LocationMatch>
